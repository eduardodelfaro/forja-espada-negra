sventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id88", "name": "Cerbero", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Un perro común se vuelve una bestia asesina (Ataque 11, Esquivar 11, 1d6 daño, 10 PG). Muere al terminar el combate si sigue vivo.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id89", "name": "Devorador de almas", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Devoras el alma del objetivo: queda inconsciente. Con un 1 en la tirada de lanzamiento, muere.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id90", "name": "Dolores fantasmales", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>La víctima siente que perdió algo importante que solo el lanzador puede devolverle. Dura un día.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id91", "name": "Fantasma férreo", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Un arma (máximo del tamaño de una espada) se vuelve invisible hasta que se usa.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id92", "name": "Gases putrefactos", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Ventaja en pruebas de característica contra todo lo <strong>Cercano<\/strong> al objetivo (persona u objeto); el objetivo no se ve afectado. Dura [[/r 1d6]] minutos.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id93", "name": "Grito ensordecedor", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Paraliza unos segundos a quien lo oiga. Mata a niños y animales.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id94", "name": "Huesos de serpiente", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>El objetivo se vuelve flexible como sin huesos: escapa de ataduras o pasa por huecos estrechos. Dura [[/r 1d6]] minutos.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id95", "name": "Inquisición", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Objetivo atado, bajo dolor intenso, responde [[/r 1d4]] preguntas (tira el DJ). Si preguntas más de lo que salió, la víctima muere.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id96", "name": "Ladrón de lenguas", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Hablas por la boca del objetivo, hasta seis palabras.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id97", "name": "Llamar al Ello", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Invocas una criatura invisible de ira: aparta un obstáculo físico o hace [[/r 2d6]] de daño y se va.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id98", "name": "Maldición del mudo", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>El objetivo no puede hablar. Con un 1 en la tirada de lanzamiento, es permanente.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id99", "name": "Mano codiciosa", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Un objeto en manos del objetivo vuela a las tuyas. Con un 1 en la tirada, el objeto se destruye.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id100", "name": "Marca de sangre", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Marcas una posesión con tu sangre (−1 PG permanente): siempre sabes dónde está. Si se destruye o se borra la marca, recuperas el PG.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id101", "name": "Marchitar", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>El objetivo queda con la fuerza y vitalidad de un anciano de 90 años durante [[/r 1d6]] horas.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id102", "name": "Mensaje onírico", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Envías un mensaje en sueños a alguien que conoces y que esté dormido. No requiere línea de visión.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id103", "name": "Murmullos", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>El objetivo oye voces extrañas que le susurran secretos oscuros.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id104", "name": "Música interminable", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Una melodía repetitiva en la cabeza del objetivo: toda tirada contra él va con Ventaja.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id105", "name": "Oscuridad", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>[[/r 1d6]] objetivos quedan cegados durante [[/r 1d6]] minutos.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id106", "name": "Portal", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Abres un portal a un lugar que ya conoces y llegas completamente desnudo. Quien te siga tira 1d6: con un 6, desaparece.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id107", "name": "Proyectil venenoso", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Envenenas un proyectil: la víctima muere en [[/r 1d6]] minutos.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id108", "name": "Rata guía", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Bajo tierra, invocas una rata que te guía a la salida más cercana. Hay que alimentarla con [[/r 1d4]] PG de sangre.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id109", "name": "Recuerdos que se desvanecen", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>El objetivo olvida lo que hizo contigo en las últimas [[/r 1d6]] horas (1d6 años con un 1 en la tirada).<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id110", "name": "Robar vida", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Tocas al objetivo y le robas [[/r 1d6]] PG. No puedes superar tus PG máximos.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id111", "name": "Sangre ácida", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Conviertes 3 PG de tu sangre en ácido: [[/r 1d6]] de daño o disuelves un objeto del tamaño de un libro pequeño.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id112", "name": "Tambores de guerra", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>El objetivo vive el horror de la guerra. Tira [[/r 1d6]]: 1-4 entra en pánico; 5-6 entra en furia berserker.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id113", "name": "Trampa roja", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>Creas un charco de tu sangre (−2 PG permanentes hasta anular el conjuro). Quien entre no puede salir.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id114", "name": "Velocidad antinatural", "type": "spell", "folder": "Conjuros BSH", "parent": "", "desc": "<p>El objetivo puede moverse hasta distancia <strong>Lejana<\/strong> en su Turno. Con un 1 en la tirada, una pieza al azar de su equipo se destruye.<\/p><p><em>Lanzar: prueba de INT (Desventaja si ya se lanzó hoy). Fallo crítico → Rasgar el velo.<\/em><\/p>", "power": ""}, {"id": "id120", "name": "Bomba", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>[[/r 1d8]] de daño a todo lo <strong>Cercano<\/strong>. Con un fallo crítico, explota a tu lado.<\/p><p><strong>Un solo uso.<\/strong><\/p>", "power": ""}, {"id": "id121", "name": "Búho de metal", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>Búho autómata que sigue órdenes simples (máx. seis palabras). 4 PG. Puede distraer a un enemigo, pero no atacar.<\/p><p>Dado de uso: <strong>1Du6<\/strong> — tirar tras cada uso. [[/r 1d6]]<\/p>", "power": ""}, {"id": "id122", "name": "Caja de nanas", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>Su música deja en trance a todo ser vivo que la oiga. El resultado del Du indica cuántos minutos dura.<\/p><p>Dado de uso: <strong>1Du6<\/strong> — tirar tras cada uso. [[/r 1d6]]<\/p>", "power": ""}, {"id": "id123", "name": "Catalejo teñido de sangre", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>Permite ver a cualquier criatura con sangre, aunque esté tras una cobertura o a oscuras.<\/p><p>Dado de uso: <strong>1Du6<\/strong> — tirar tras cada uso. [[/r 1d6]]<\/p>", "power": ""}, {"id": "id124", "name": "Cristal de imagen", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>Proyecta una imagen de tamaño humano o menor, definida al construir el cristal.<\/p><p>Dado de uso: <strong>1Du6<\/strong> — tirar tras cada uso. [[/r 1d6]]<\/p>", "power": ""}, {"id": "id125", "name": "Gas alucinógeno", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>Solo en interiores. Tira [[/r 1d6]] por cada persona en la sala:<ul><li><strong>1-2:<\/strong> relajado y fácil de influenciar.<\/li><li><strong>3-5:<\/strong> sueños vívidos, ajeno a lo que pasa alrededor.<\/li><li><strong>6:<\/strong> pesadilla: pánico y gritos.<\/li><\/ul><\/p><p><strong>Un solo uso.<\/strong><\/p>", "power": ""}, {"id": "id126", "name": "Granada de gas del terror", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[2]<\/strong><\/p><p>Tira [[/r 1d6]] por cada PNJ:<ul><li><strong>1-4:<\/strong> huye aterrorizado.<\/li><li><strong>5-6:<\/strong> entra en furia berserker (+[[/r 1d4]] al daño).<\/li><\/ul><\/p><p><strong>Un solo uso.<\/strong><\/p>", "power": ""}, {"id": "id127", "name": "Lanza de fuego", "type": "weapon", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[6]<\/strong><\/p><p>Un ataque exitoso añade [[/r 1d4]] de <strong>daño continuado<\/strong>.<\/p><p>Dado de uso: <strong>1Du6<\/strong> — tirar después de cada combate. [[/r 1d6]]<\/p>", "power": ""}, {"id": "id128", "name": "Licor de la resurrección", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>En vez de tirar en la tabla de «Incapacitado», el objetivo tira [[/r 1d20]]. Con un 20, muere (seguramente de forma horrible).<\/p><p><strong>Un solo uso.<\/strong><\/p>", "power": ""}, {"id": "id129", "name": "Martillo de guerra gélido", "type": "weapon", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[6]<\/strong><\/p><p>Congela la materia inerte que golpea y la vuelve fácil de romper. Con un 20 al usarlo, el portador sufre [[/r 1d6]] de daño de hielo y el martillo se destruye.<\/p><p>Dado de uso: <strong>1Du6<\/strong> — tirar después de cada combate. [[/r 1d6]]<\/p>", "power": ""}, {"id": "id130", "name": "Máscara de gas", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[2]<\/strong><\/p><p>Una máscara antigás. Hace exactamente lo que imaginas.<\/p><p>Dado de uso: <strong>1Du6<\/strong> — tirar tras cada uso. [[/r 1d6]]<\/p>", "power": ""}, {"id": "id131", "name": "Monóculo de puntería", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>Ignora cualquier penalizador a las tiradas de ataque a distancia (incluido el nivel del objetivo).<\/p><p>Dado de uso: <strong>1Du6<\/strong> — tirar tras cada uso. [[/r 1d6]]<\/p>", "power": ""}, {"id": "id132", "name": "Prótesis", "type": "equipment", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[10]<\/strong><\/p><p>Funciona como la parte original. Se puede sacrificar para anular el daño de un ataque.<\/p><p><strong>No usa dado de uso.<\/strong><\/p>", "power": ""}, {"id": "id133", "name": "Pulverizador de ácido", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>El daño de las armas enemigas baja un rango.<\/p><p><strong>Un solo uso.<\/strong><\/p>", "power": ""}, {"id": "id134", "name": "Suero de la verdad", "type": "consumable", "folder": "Ciencia macabra BSH", "parent": "", "desc": "<p><em>Ciencia macabra<\/em> — <strong>[4]<\/strong><\/p><p>Un PNJ inyectado cuenta todo lo que sabe. Tira [[/r 1d20]]: con 15-20, el PNJ muere antes de hablar.<\/p><p><strong>Un solo uso.<\/strong><\/p>", "power": ""}, {"id": "id137", "name": "Abismo", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>El objetivo se vuelve monstruoso o deforme y provoca miedo y repulsión durante [[/r 1d6]] horas.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El efecto es permanente.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id138", "name": "Codicia", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>Creas [[/r 4d6]] monedas falsas que vuelven a su estado real en una hora.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El demonio también le roba [[/r 4d6]] monedas al brujo o a sus aliados.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id139", "name": "Envidia", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>El objetivo intenta quedarse con un objeto que elijas y que esté a la vista, incluso por la fuerza.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El objeto es una pieza de tu propio equipo.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id140", "name": "Gula", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>El objetivo ataca a gente al azar intentando comérsela, hasta devorar [[/r 2d6]] PG.<\/p><p><strong>Con un 1 en Perdición:<\/strong> Intentará comerse al brujo.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id141", "name": "Ira", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>El objetivo pierde los estribos y ataca a todo el que vea.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El brujo también se ve afectado.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id142", "name": "Miedo", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>Descubres el miedo más profundo del objetivo.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El objetivo también descubre <em>tu<\/em> miedo más profundo.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id143", "name": "Odio", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>El objetivo insulta a alguien que elijas durante [[/r 1d6]] minutos.<\/p><p><strong>Con un 1 en Perdición:<\/strong> Tú también insultas al objetivo.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id144", "name": "Olvido", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>Todo el mundo olvida al objetivo durante [[/r 1d6]] horas.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El demonio te roba un trasfondo hasta tu próximo descanso largo.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id145", "name": "Pereza", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>El objetivo cae dormido.<\/p><p><strong>Con un 1 en Perdición:<\/strong> Nunca despertará.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id146", "name": "Pesadilla", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>El objetivo pasa la noche sin dormir: al día siguiente, las pruebas contra él van con <strong>Ventaja<\/strong>.<\/p><p><strong>Con un 1 en Perdición:<\/strong> La ira lo domina y las pruebas contra él van con <strong>Desventaja<\/strong>.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id147", "name": "Ruina", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>Destruye una pieza de equipo, desde una daga hasta un carro.<\/p><p><strong>Con un 1 en Perdición:<\/strong> También se rompe una pieza de tu equipo.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id148", "name": "Soledad", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>Nadie nota al objetivo: no se le ve ni se le oye durante [[/r 1d6]] horas.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El brujo tampoco puede verlo.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id149", "name": "Sospecha", "type": "demon", "folder": "Demonios BSH", "parent": "", "desc": "<p>Eliges a alguien a la vista como blanco de las sospechas del objetivo.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El brujo también se convierte en blanco de sus sospechas.<\/p><p><em>Invocar: tira Perdición (Desventaja por cada demonio extra invocado hoy). Si el dado se agota → @UUID[RollTable.id135]{Represalia demoníaca}.<\/em><\/p>", "power": ""}, {"id": "id154", "name": "Espíritu ancestral", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>El consejo de un ancestro da <strong>Ventaja<\/strong> en una prueba de característica. Necesitas un objeto que le haya pertenecido.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El ancestro desaprueba tu acción: en su lugar tienes <strong>Desventaja<\/strong>.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id155", "name": "Espíritu de la enfermedad", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>El objetivo cae con una enfermedad grave que lo deja en cama.<\/p><p><strong>Con un 1 en Perdición:<\/strong> La enfermedad es contagiosa.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id156", "name": "Espíritu del bosque", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>En el bosque te ayuda a encontrar camino, comida, agua o refugio. También puede hacer que las plantas estorben a los enemigos: <strong>Ventaja<\/strong> en pruebas de característica contra ellos durante un Turno.<\/p><p><strong>Con un 1 en Perdición:<\/strong> Te hace pasar un mal rato: no puedes hacer descansos cortos ni largos durante dos días.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id157", "name": "Espíritu del dolor", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>Un dolor tan fuerte que el objetivo no puede actuar durante un <strong>Turno<\/strong>.<\/p><p><strong>Con un 1 en Perdición:<\/strong> También afecta al chamán.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id158", "name": "Espíritu del fuego", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>Manipulas un fuego existente: duplicar su tamaño, darle forma, moverlo… Puede hacer [[/r 1d6]] de daño y luego [[/r 1d6]] de <strong>daño continuado<\/strong>.<\/p><p><strong>Con un 1 en Perdición:<\/strong> Tú también te quemas.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id159", "name": "Espíritu del río", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>Con agua presente, la manipulas: duplicar su volumen, darle forma, moverla…<\/p><p><strong>Con un 1 en Perdición:<\/strong> El agua desaparece.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id160", "name": "Espíritu del señor de los animales", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>Los animales acuden en tu ayuda (sin arriesgar la vida) o dejan de atacarte.<\/p><p><strong>Con un 1 en Perdición:<\/strong> Los animales huyen, o te atacan si son depredadores.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id161", "name": "Espíritu del viento", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>Apaga llamas, dispersa vapores tóxicos o incluso derriba humanoides.<\/p><p><strong>Con un 1 en Perdición:<\/strong> Efecto contrario: las llamas crecen, los vapores van hacia el chamán, etc.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id162", "name": "Espíritu famélico", "type": "spirit", "folder": "Espíritus BSH", "parent": "", "desc": "<p>El objetivo busca agua y comida de inmediato y no se detiene hasta comer una comida completa.<\/p><p><strong>Con un 1 en Perdición:<\/strong> El chamán también se ve afectado.<\/p><p><em>Llamar: tira Perdición (Desventaja por cada espíritu extra llamado hoy; se restablece tras un descanso largo).<\/em><\/p>", "power": ""}, {"id": "id195", "name": "Berserker", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em> <span style=\"color:#c4283f\"><strong>(único)<\/strong><\/span><\/p><p>Cuando entras en furia, sumas [[/r 1d6]] al daño que haces y el daño que recibes se divide por 2. La furia termina cuando sacas un 1 en ese d6. Necesitas un descanso largo para volver a enfurecerte.<\/p><p><strong>+1 FUE<\/strong><\/p>", "power": ""}, {"id": "id196", "name": "Cacique", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p>Puedes usar FUE en lugar de CAR para intimidar.<\/p><p><strong>+1 FUE<\/strong><\/p>", "power": ""}, {"id": "id197", "name": "Herbolario", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p>Puedes preparar [[/r 1d6]] dosis de: bálsamo curativo (cada dosis cura 1d6 + nivel PG), drogas alucinógenas o veneno (1d6 de daño por dosis). Para reponer, necesitas un descanso largo en plena naturaleza.<\/p><p><strong>+1 INT<\/strong><\/p>", "power": ""}, {"id": "id198", "name": "Cazador", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p>En combate, tu primera flecha siempre acierta y sumas tu nivel al daño.<\/p><p><strong>+1 DES<\/strong><\/p>", "power": ""}, {"id": "id199", "name": "Saqueador", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p>Con un éxito crítico en una tirada de ataque, haces daño igual a tu puntuación de FUE (sin tirar daño).<\/p><p><strong>+1 FUE<\/strong><\/p>", "power": ""}, {"id": "id200", "name": "Explorador", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p><strong>Ventaja<\/strong> en tus tiradas de iniciativa.<\/p><p><strong>+1 SAB<\/strong><\/p>", "power": ""}, {"id": "id201", "name": "Chamán", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p>Tienes una alianza con <strong>dos espíritus<\/strong>. Elige o tira en @UUID[RollTable.id163]{Espíritu al azar}.<\/p><p><strong>+1 SAB<\/strong><\/p>", "power": ""}, {"id": "id202", "name": "Narrador", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p>Siempre conoces [[/r 1d4]] cosas interesantes sobre objetos, lugares o personas (una tirada por sesión). Mientras cuentas una historia, tu público no se da cuenta de lo que pasa alrededor.<\/p><p><strong>+1 CAR<\/strong><\/p>", "power": ""}, {"id": "id203", "name": "Superviviente", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p>En [[/r 1d6]] minutos siempre encuentras algo que sirva como cuchillo o garrote.<\/p><p><strong>+1 CON<\/strong><\/p>", "power": ""}, {"id": "id204", "name": "Salvaje", "type": "gift", "folder": "Trasfondos — Bárbaro", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo bárbaro<\/em><\/p><p>Puedes hacer un descanso largo en cualquier lugar, sin importar la situación.<\/p><p><strong>+1 CON<\/strong><\/p>", "power": ""}, {"id": "id206", "name": "Guardaespaldas", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em><\/p><p>Si usas una acción para proteger a alguien <strong>Cercano<\/strong>, hasta tu próximo turno recibes tú el daño de los ataques contra él, pero dividido por 2 (redondeando hacia arriba).<\/p><p><strong>+1 CON<\/strong><\/p>", "power": ""}, {"id": "id207", "name": "Ratón de biblioteca", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em><\/p><p>Puedes cambiar cualquier prueba de característica por una de INT (explica cómo te ayuda lo que sabes). Se recarga tras un descanso largo.<\/p><p><strong>+1 INT<\/strong><\/p>", "power": ""}, {"id": "id208", "name": "Diplomático", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em><\/p><p>Conoces <strong>dos idiomas adicionales<\/strong> y te haces entender con cualquiera dispuesto a escucharte. Si solo vas a hablar, puedes actuar primero al comienzo de cualquier turno de combate.<\/p><p><strong>+1 CAR<\/strong><\/p>", "power": ""}, {"id": "id209", "name": "Inventor", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em> <span style=\"color:#c4283f\"><strong>(único)<\/strong><\/span><\/p><p>Sabes construir <strong>dos<\/strong> maravillas de la ciencia macabra (carpeta «Ciencia macabra BSH»).<\/p><p><strong>+1 INT<\/strong><\/p>", "power": ""}, {"id": "id210", "name": "Legionario", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em><\/p><p>Estás acostumbrado a luchar en formación. Tres veces por sesión, un aliado <strong>Cercano<\/strong> puede repetir una tirada fallida de esquivar, parar o atacar.<\/p><p><strong>+1 FUE<\/strong><\/p>", "power": ""}, {"id": "id211", "name": "Sofista", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em><\/p><p>Con una prueba de CAR exitosa, haces que alguien crea una mentira descarada. El efecto dura una hora. Una vez por sesión.<\/p><p><strong>+1 CAR<\/strong><\/p>", "power": ""}, {"id": "id212", "name": "Pilluelo callejero", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em><\/p><p><strong>Ventaja<\/strong> en sigilo, carterismo, espionaje y astucia callejera.<\/p><p><strong>+1 DES<\/strong><\/p>", "power": ""}, {"id": "id213", "name": "Cirujano", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em><\/p><p>Haz una prueba de INT al atender a alguien con 0 PG: si tienes éxito, tira 1d4 en la tabla de Incapacitado en lugar de 1d6.<\/p><p><strong>+1 INT<\/strong><\/p>", "power": ""}, {"id": "id214", "name": "Maestro de la espada", "type": "gift", "folder": "Trasfondos — Civilizado", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo civilizado<\/em><\/p><p>Puedes usar DES en lugar de FUE en ataques cuerpo a cuerpo con armas blancas de una mano.<\/p><p><strong>+1 DES<\/strong><\/p>", "power": ""}, {"id": "id216", "name": "Asesino", "type": "gift", "folder": "Trasfondos — Decadente", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo decadente<\/em> <span style=\"color:#c4283f\"><strong>(único)<\/strong><\/span><\/p><p>Tu primer ataque contra un objetivo desprevenido acierta automáticamente y hace daño igual a tu DES.<\/p><p><strong>+1 DES<\/strong><\/p>", "power": ""}, {"id": "id217", "name": "Changeling", "type": "gift", "folder": "Trasfondos — Decadente", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo decadente<\/em><\/p><p>Te raptaron de bebé y te criaron las hadas. Elige <strong>dos lazos de hadas<\/strong> (@UUID[RollTable.id179]{Lazo de hadas al azar}).<\/p><p><strong>+1 CAR<\/strong><\/p>", "power": ""}, {"id": "id218", "name": "Conocimiento prohibido", "type": "gift", "folder": "Trasfondos — Decadente", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo decadente<\/em><\/p><p>Empiezas el juego con <strong>4 conjuros al azar<\/strong>: tira 4 veces en @UUID[RollTable.id116]{Conjuro al azar}.<\/p><p><strong>+1 INT<\/strong><\/p>", "power": ""}, {"id": "id219", "name": "Luchador de foso", "type": "gift", "folder": "Trasfondos — Decadente", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo decadente<\/em><\/p><p>Tu daño desarmado es igual a tu daño con armas.<\/p><p><strong>+1 FUE<\/strong><\/p>", "power": ""}, {"id": "id220", "name": "Sangre de serpiente", "type": "gift", "folder": "Trasfondos — Decadente", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo decadente<\/em><\/p><p>Eres inmune a venenos y ponzoñas.<\/p><p><strong>+1 CON<\/strong><\/p>", "power": ""}, {"id": "id221", "name": "Despiadado", "type": "gift", "folder": "Trasfondos — Decadente", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo decadente<\/em><\/p><p>Tu dado de daño con armas es d8 (d6 desarmado).<\/p><p><strong>+1 FUE<\/strong><\/p>", "power": ""}, {"id": "id222", "name": "Brujo", "type": "gift", "folder": "Trasfondos — Decadente", "parent": "Trasfondos BSH", "desc": "<p><em>Trasfondo decadente<\/em><\/p><p>Tienes un pacto con <strong>dos demonios<\/strong> (@UUID[RollTable.id150]{Demonio al azar}).<\/p><p><strong>+1 CAR<\/strong><\/p>", "power": ""}, {"id": "id224", "name": "Bárbaro", "type": "origin", "folder": "Orígenes BSH", "parent": "", "desc": "<p><em>Origen<\/em><\/p><p>Puede valorar el honor y el coraje, pero cae con facilidad en la violencia y la superstición.<\/p><p><strong>Nacimiento:<\/strong> @UUID[RollTable.id183]{tirar 1d20}<\/p><p><strong>Monedas iniciales:<\/strong> 25<\/p><p><strong>Armas iniciales:<\/strong> @UUID[RollTable.id186]{tabla Bárbaro} (tira 1 vez aquí y 1 vez en la tabla de origen que elijas).<\/p><p><strong>Trasfondos de este origen:<\/strong><\/p><ul><li>@UUID[Item.id195]{Berserker}<\/li><li>@UUID[Item.id196]{Cacique}<\/li><li>@UUID[Item.id197]{Herbolario}<\/li><li>@UUID[Item.id198]{Cazador}<\/li><li>@UUID[Item.id199]{Saqueador}<\/li><li>@UUID[Item.id200]{Explorador}<\/li><li>@UUID[Item.id201]{Chamán}<\/li><li>@UUID[Item.id202]{Narrador}<\/li><li>@UUID[Item.id203]{Superviviente}<\/li><li>@UUID[Item.id204]{Salvaje}<\/li><\/ul><p><em>Elige 3 trasfondos: 2 de tu origen y 1 de cualquier lista. No puedes tener dos «únicos».<\/em><\/p>", "power": ""}, {"id": "id225", "name": "Civilizado", "type": "origin", "folder": "Orígenes BSH", "parent": "", "desc": "<p><em>Origen<\/em><\/p><p>Aprecia el conocimiento y el progreso, pero tiende a ver a los demás como inferiores o primitivos.<\/p><p><strong>Nacimiento:<\/strong> @UUID[RollTable.id184]{tirar 1d20}<\/p><p><strong>Monedas iniciales:<\/strong> 50<\/p><p><strong>Armas iniciales:<\/strong> @UUID[RollTable.id187]{tabla Civilizado} (tira 1 vez aquí y 1 vez en la tabla de origen que elijas).<\/p><p><strong>Trasfondos de este origen:<\/strong><\/p><ul><li>@UUID[Item.id206]{Guardaespaldas}<\/li><li>@UUID[Item.id207]{Ratón de biblioteca}<\/li><li>@UUID[Item.id208]{Diplomático}<\/li><li>@UUID[Item.id209]{Inventor}<\/li><li>@UUID[Item.id210]{Legionario}<\/li><li>@UUID[Item.id211]{Sofista}<\/li><li>@UUID[Item.id212]{Pilluelo callejero}<\/li><li>@UUID[Item.id213]{Cirujano}<\/li><li>@UUID[Item.id214]{Maestro de la espada}<\/li><\/ul><p><em>Elige 3 trasfondos: 2 de tu origen y 1 de cualquier lista. No puedes tener dos «únicos».<\/em><\/p>", "power": ""}, {"id": "id226", "name": "Decadente", "type": "origin", "folder": "Orígenes BSH", "parent": "", "desc": "<p><em>Origen<\/em><\/p><p>Viene de una sociedad condenada: melancólico y miserable, o despreocupado y feliz de sobrevivir un día más.<\/p><p><strong>Nacimiento:<\/strong> @UUID[RollTable.id185]{tirar 1d20}<\/p><p><strong>Monedas iniciales:<\/strong> 100<\/p><p><strong>Armas iniciales:<\/strong> @UUID[RollTable.id188]{tabla Decadente} (tira 1 vez aquí y 1 vez en la tabla de origen que elijas).<\/p><p><strong>Trasfondos de este origen:<\/strong><\/p><ul><li>@UUID[Item.id216]{Asesino}<\/li><li>@UUID[Item.id217]{Changeling}<\/li><li>@UUID[Item.id218]{Conocimiento prohibido}<\/li><li>@UUID[Item.id219]{Luchador de foso}<\/li><li>@UUID[Item.id220]{Sangre de serpiente}<\/li><li>@UUID[Item.id221]{Despiadado}<\/li><li>@UUID[Item.id222]{Brujo}<\/li><\/ul><p><em>Elige 3 trasfondos: 2 de tu origen y 1 de cualquier lista. No puedes tener dos «únicos».<\/em><\/p>", "power": ""}, {"id": "id229", "name": "Fortaleza mental", "type": "gift", "folder": "Dones de Equilibrio", "parent": "Dones BSH", "desc": "<p><em>Don de Equilibrio<\/em><\/p><p><strong>Ventaja<\/strong> en las pruebas de característica para resistir conjuros.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "balance"}, {"id": "id230", "name": "Meditación", "type": "gift", "folder": "Dones de Equilibrio", "parent": "Dones BSH", "desc": "<p><em>Don de Equilibrio<\/em><\/p><p>Tu dado de <strong>Perdición<\/strong> se recupera tras un descanso <strong>corto<\/strong>.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "balance"}, {"id": "id231", "name": "Segundo aliento", "type": "gift", "folder": "Dones de Equilibrio", "parent": "Dones BSH", "desc": "<p><em>Don de Equilibrio<\/em><\/p><p>Una vez al día recuperas PG iguales a tu nivel, incluso en combate.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "balance"}, {"id": "id232", "name": "Alianza de espíritus", "type": "gift", "folder": "Dones de Equilibrio", "parent": "Dones BSH", "desc": "<p><em>Don de Equilibrio<\/em><\/p><p><strong>Ventaja<\/strong> al llamar a un espíritu concreto (elígelo).<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "balance"}, {"id": "id233", "name": "Suerte del superviviente", "type": "gift", "folder": "Dones de Equilibrio", "parent": "Dones BSH", "desc": "<p><em>Don de Equilibrio<\/em><\/p><p>Una vez por sesión ignoras todo el daño de un ataque, pero pierdes un arma en el proceso.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "balance"}, {"id": "id235", "name": "Armadura de cicatrices", "type": "gift", "folder": "Dones de Caos", "parent": "Dones BSH", "desc": "<p><em>Don de Caos<\/em><\/p><p>Reduces en 1 el daño que recibes cuando <strong>no<\/strong> llevas armadura.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "chaos"}, {"id": "id236", "name": "Sed de sangre", "type": "gift", "folder": "Dones de Caos", "parent": "Dones BSH", "desc": "<p><em>Don de Caos<\/em><\/p><p>Tu dado de daño sube un tamaño.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "chaos"}, {"id": "id237", "name": "Revelación oscura", "type": "gift", "folder": "Dones de Caos", "parent": "Dones BSH", "desc": "<p><em>Don de Caos<\/em><\/p><p>Tiras con <strong>Ventaja<\/strong> en @UUID[RollTable.id115]{Rasgar el velo}.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "chaos"}, {"id": "id238", "name": "Amistades dudosas", "type": "gift", "folder": "Dones de Caos", "parent": "Dones BSH", "desc": "<p><em>Don de Caos<\/em><\/p><p>Tiras con <strong>Ventaja<\/strong> en @UUID[RollTable.id135]{Represalia demoníaca}.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "chaos"}, {"id": "id239", "name": "Paranoico", "type": "gift", "folder": "Dones de Caos", "parent": "Dones BSH", "desc": "<p><em>Don de Caos<\/em><\/p><p><strong>Ventaja<\/strong> en tus tiradas de iniciativa.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "chaos"}, {"id": "id241", "name": "Curtido en batalla", "type": "gift", "folder": "Dones de Ley", "parent": "Dones BSH", "desc": "<p><em>Don de Ley<\/em><\/p><p>En combate, logras un éxito crítico con un resultado natural de 1 a 3.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "law"}, {"id": "id242", "name": "Ingenioso", "type": "gift", "folder": "Dones de Ley", "parent": "Dones BSH", "desc": "<p><em>Don de Ley<\/em><\/p><p>Una vez por sesión repones un dado de uso (excepto Perdición) sin necesidad de descansar.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "law"}, {"id": "id243", "name": "Enigma del acero", "type": "gift", "folder": "Dones de Ley", "parent": "Dones BSH", "desc": "<p><em>Don de Ley<\/em><\/p><p>Una de tus armas hace daño d12, pero si sacas un 1 en el daño, se rompe.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "law"}, {"id": "id244", "name": "Duro como un clavo", "type": "gift", "folder": "Dones de Ley", "parent": "Dones BSH", "desc": "<p><em>Don de Ley<\/em><\/p><p>Si sobrevives tras tirar en la tabla de Incapacitado, sumas tu nivel a los PG que recuperas.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "law"}, {"id": "id245", "name": "Ganas de vivir", "type": "gift", "folder": "Dones de Ley", "parent": "Dones BSH", "desc": "<p><em>Don de Ley<\/em><\/p><p><strong>Ventaja<\/strong> cuando tiras en la tabla de Incapacitado.<\/p><p><em>Cada don solo se puede tomar una vez.<\/em><\/p>", "power": "law"}, {"id": "id167", "name": "Sabiduría del túmulo", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Nigromancia rudimentaria: puedes hablar con los muertos si su cuerpo o su alma están cerca. Rara vez cooperan y pueden pedir un precio, pero puedes intentar obligarlos a hacer algo o a responder una pregunta: prueba de <strong>SAB<\/strong> y baja tu dado de <strong>Perdición<\/strong>.<\/p>", "power": ""}, {"id": "id168", "name": "Caldero de oro", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Tienes un bezante de oro mágico (vale 100 monedas) que siempre vuelve a tu bolsa [[/r 1d8]] amaneceres después de gastarlo. Forma parte de un tesoro inmenso al que podría llevarte… si supieras el amuleto adecuado.<\/p>", "power": ""}, {"id": "id169", "name": "Conocimiento cambiante", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Criado por las hadas, dominas <strong>dos<\/strong> de estos temas: caza y rastreo · historia y mito · modales cortesanos e intriga · filosofía y metafísica · estrategia y táctica · metalurgia y minería · otro (con aprobación del DJ). <strong>Ventaja<\/strong> en pruebas relacionadas.<\/p>", "power": ""}, {"id": "id170", "name": "Arma de hierro frío", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Heredaste, robaste o encontraste una espada legendaria con nombre, leyenda y quizá una oscura profecía. Hace <strong>+[[/r 1d6]]<\/strong> de daño a cualquier ser feérico.<\/p>", "power": ""}, {"id": "id171", "name": "Condenado a la grandeza", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Una vez al día puedes tirar tu dado de <strong>Perdición<\/strong> con <strong>Ventaja<\/strong>. Después necesitas [[/r 1d3]] descansos largos para recuperarlo a su máximo.<\/p>", "power": ""}, {"id": "id172", "name": "Engaño de los enanos", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p><strong>Ventaja<\/strong> cuando mientes o cuando te escabulles con intención de hacer daño.<\/p>", "power": ""}, {"id": "id173", "name": "Secreto élfico", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Aprendiste <strong>uno<\/strong> de estos secretos: hablar con los pájaros · que las plantas obedezcan una orden de una palabra · volverte invisible para los mortales · cautivar a un amante · adivinar el deseo más secreto de alguien · hacer temblar de miedo a mortales no agresivos. Si lo usas más de una vez al día, tira <strong>Perdición<\/strong>.<\/p>", "power": ""}, {"id": "id174", "name": "Hechicero platero", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Sabes atrapar conjuros en tus joyas. Tira <strong>dos conjuros<\/strong> en @UUID[RollTable.id116]{Conjuro al azar}. Puedes vincular uno a una de tus creaciones: cuesta [[/r 1d6*100]] monedas y [[/r 3d6]] días de trabajo. Quien porte la joya puede lanzar el conjuro como un hechicero.<\/p>", "power": ""}, {"id": "id175", "name": "Cambiapieles", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Conoces los conjuros para transformarte en un animal mientras llevas una piel especialmente preparada. Puedes tener hasta <strong>dos<\/strong> de estas pieles a la vez.<\/p>", "power": ""}, {"id": "id176", "name": "Robustez de trol", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p><strong>+1 a la protección<\/strong> de cualquier armadura que lleves.<\/p>", "power": ""}, {"id": "id177", "name": "Fe verdadera", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Sabes luchar contra las hadas con fuego, fe y hierro. Tira tu dado de <strong>Perdición<\/strong> para disipar un efecto mágico de origen feérico.<\/p>", "power": ""}, {"id": "id178", "name": "Visión de bruja", "type": "gift", "folder": "Lazos de hadas BSH", "parent": "", "desc": "<p><em>Lazo de hadas (trasfondo Changeling)<\/em><\/p><p>Ves a través del velo que oculta los reinos feéricos: elfos, trols y otros seres mágicos siempre son visibles para ti. Con una prueba de <strong>SAB<\/strong> exitosa puedes ver auras mágicas y detectar ilusiones.<\/p>", "power": ""}], "tables": [{"id": "id115", "name": "Rasgar el velo (1d6)", "formula": "1d6", "results": [{"r": 1, "text": "No puedes lanzar conjuros hasta el próximo amanecer."}, {"r": 2, "text": "La magia te desgarra: pierdes [[/r 1d6]] PG."}, {"r": 3, "text": "Explosión arcana: [[/r 1d6]] de daño a todo lo Cercano."}, {"r": 4, "text": "Pagas tu arrogancia: −1 PG máximo permanente."}, {"r": 5, "text": "Tu mente se quiebra: −1 INT permanente."}, {"r": 6, "text": "Una monstruosidad con tentáculos aparece y te arrastra a otro plano."}]}, {"id": "id116", "name": "Conjuro al azar (1d30)", "formula": "1d30", "results": [{"r": 1, "text": "Alimentar el fuego"}, {"r": 2, "text": "Animar espejo"}, {"r": 3, "text": "Aislante"}, {"r": 4, "text": "Cerbero"}, {"r": 5, "text": "Devorador de almas"}, {"r": 6, "text": "Dolores fantasmales"}, {"r": 7, "text": "Fantasma férreo"}, {"r": 8, "text": "Gases putrefactos"}, {"r": 9, "text": "Grito ensordecedor"}, {"r": 10, "text": "Huesos de serpiente"}, {"r": 11, "text": "Inquisición"}, {"r": 12, "text": "Ladrón de lenguas"}, {"r": 13, "text": "Llamar al Ello"}, {"r": 14, "text": "Maldición del mudo"}, {"r": 15, "text": "Mano codiciosa"}, {"r": 16, "text": "Marca de sangre"}, {"r": 17, "text": "Marchitar"}, {"r": 18, "text": "Mensaje onírico"}, {"r": 19, "text": "Murmullos"}, {"r": 20, "text": "Música interminable"}, {"r": 21, "text": "Oscuridad"}, {"r": 22, "text": "Portal"}, {"r": 23, "text": "Proyectil venenoso"}, {"r": 24, "text": "Rata guía"}, {"r": 25, "text": "Recuerdos que se desvanecen"}, {"r": 26, "text": "Robar vida"}, {"r": 27, "text": "Sangre ácida"}, {"r": 28, "text": "Tambores de guerra"}, {"r": 29, "text": "Trampa roja"}, {"r": 30, "text": "Velocidad antinatura function permitido(x) {
  if (P.trasfondos.includes(x.name)) return true;
  if (P.trasfondos.length >= 3) return false;
  if (x.origen === 'feérico' && !esFeerico()) return false;

}
function validar() {
  const o = (P.origen || '').toLowerCase(), e = elegidos();
  if (!P.origen) return [false, t('vSinOrigen')];
  if (e.length < 3) return [false, t('vFaltan')(3 - e.length)];
  const propios = e.filter(x => x.origen === o).length;
  if (esFeerico()) { if (propios !== 1) return [false, t('vFeerico')]; }
  else if (propios < 2) return [false, t('vPropios')(nomOrigen(P.origen))];
  return [true, t('vOk')];
}
function completarTras() {
  const o = P.origen.toLowerCase();
  const V = trasVisibles();
  const propios = V.filter(x => x.origen === o), otros = V.filter(x => x.origen !== o);
  const plan = esFeerico() ? [propios, otros, otros] : [propios, propios, V];
  const tieneP = () => elegidos().filter(x => x.origen === o).length;
  for (const [i, pool] of plan.entries()) {
    if (P.trasfondos.length >= 3) break;
    if (!esFeerico() && i < 2 && tieneP() >= 2) continue;

    if (ops.length) P.trasfondos.push(ops[0].name);

}

}

// ---------- acciones ----------
function irA(i) { S = Math.max(0, Math.min(PASOS.length - 1, i)); renderNav(); renderCodigo();
  const nav = $('.pasos-nav'); if (nav.getBoundingClientRect().top < 0) nav.scrollIntoView({ block: 'start' }); }
function elegirOrigen(o) {
  if (P.origen === o) return;
  P.origen = o; P.trasfondos = []; P.poderes = {}; P.armas = [null, null]; P.tablaA2 = tablaArmas(o)?.name || '';
  tirarNacimiento(); tirarRasgos();
}
function tirarCarac() { for (const k of CARS) P.base[k] = tirar('3d6'); }
function nombreAzar() {
  const base = D.NOMBRES ? pick(D.NOMBRES[$('#cultura').value || pick(Object.keys(D.NOMBRES))]) : nombreSil();
  P.nombre = base + ($('#conApodo').checked ? ` «${pick(apodos())}»` : '');
}
function todoAzar() {
  P = vacio(); nombreAzar(); elegirOrigen(pick(origenesVisibles()).name); completarTras(); sincronizarPoderes();
  tirarCarac(); P.tablaA2 = pick(tablasArmasVisibles()).name; tirarArma(0); tirarArma(1);
}
const sinOrigen = () => { if (!P.origen) { toast(t('vSinOrigen')); return true; } return false; };

$$('.idiomas button').forEach(b => b.onclick = () => { LANG = b.dataset.lang; try { localStorage.setItem(LKEY, LANG); } catch {} textosFijos(); render(); });
$('#pasosNav').onclick = e => { const b = e.target.closest('[data-ir]'); if (b) irA(+b.dataset.ir); };
$('#anterior').onclick = () => irA(S - 1);
$('#siguiente').onclick = () => irA(S + 1);
$('#nombre').addEventListener('input', e => { P.nombre = e.target.value; renderHoja(); renderCodigo(); renderNav(); });
$('#jugador').addEventListener('input', e => { P.jugador = e.target.value; renderHoja(); renderCodigo(); });
$('#azarNombre').onclick = () => { nombreAzar(); render(); };
$('#origenes').onclick = e => { const b = e.target.closest('[data-o]'); if (b) { elegirOrigen(b.dataset.o); render(); } };
$('#azarOrigen').onclick = () => { elegirOrigen(pick(origenesVisibles()).name); render(); };
$('#trasfondos').onchange = e => { const n = e.target.dataset.t; if (!n) return;
  P.trasfondos = e.target.checked ? [...P.trasfondos, n] : P.trasfondos.filter(x => x !== n); sincronizarPoderes(); render(); };
$('#azarTras').onclick = () => { if (sinOrigen()) return; completarTras(); sincronizarPoderes(); render(); };
$('#carac').oninput = e => { const k = e.target.dataset.c; if (!k) return; P.base[k] = Math.max(1, Math.min(20, +e.target.value || 0)); renderHoja(); renderCodigo();
  const f = finales(); e.target.nextElementSibling.textContent = f[k] > P.base[k] ? `+${f[k] - P.base[k]} → ${f[k]}` : ''; };
$('#tirarCarac').onclick = () => { tirarCarac(); render(); };
$('#tirarNac').onclick = () => { if (sinOrigen()) return; tirarNacimiento(); render(); };
$('#tirarA1').onclick = () => { if (sinOrigen()) return; tirarArma(0); render(); };
$('#tirarA2').onclick = () => { if (sinOrigen()) return; tirarArma(1); render(); };
$('#tirarTodoNac').onclick = () => { if (sinOrigen()) return; tirarNacimiento(); tirarArma(0); tirarArma(1); render(); };
$('#tablaA2').onchange = e => { P.tablaA2 = e.target.value; };
$('#poderes').onchange = e => { const k = e.target.dataset.p, n = e.target.dataset.n; if (!k) return;
  const sel = P.poderes[k];
  if (e.target.checked) { if (sel.length >= PODERES[k].n) { e.target.checked = false; return toast(t('tMax')(PODERES[k].n)); } sel.push(n); }
  else P.poderes[k] = sel.filter(x => x !== n);
  render(); };
$('#poderes').onclick = e => { const k = e.target.dataset.repoder; if (k) { delete P.poderes[k]; sincronizarPoderes(); render(); } };
$('#materiales').onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return;
  MATERIAL = b.dataset.m; try { localStorage.setItem(MKEY, MATERIAL); } catch {}
  if (MATERIAL === 'core') {
    if (P.origen && !BASE.includes(P.origen)) { P.origen = ''; P.trasfondos = []; P.poderes = {}; P.armas = [null, null]; P.nacimiento = ''; P.rasgos = null; }
    P.trasfondos = P.trasfondos.filter(n => trasVisibles().some(x => x.name === n)); sincronizarPoderes();
    if (P.tablaA2 && !tablasArmasVisibles().some(x => x.name === P.tablaA2)) P.tablaA2 = tablaArmas(P.origen)?.name || '';
  }
  render(); };
$('#tirarRasgos').onclick = () => { if (sinOrigen()) return; tirarRasgos(); render(); };
const EN_MARCO = (() => { try { return window.self !== window.top; } catch { return true; } })();
$('#imprimir').onclick = () => { renderPdf(); try { window.print(); } catch {} };
$('#azarTodo').onclick = () => { todoAzar(); S = PASOS.length - 1; render(); toast(t('tForjado')); };
$('#nuevo').onclick = () => { P = vacio(); S = 0; render(); };
$('#copiar').onclick = async () => {
  const [ok, msg] = validar(); if (!ok) toast(t('tAviso') + msg);
  try { await navigator.clipboard.writeText($('#codigo').value); if (ok) toast(t('tCopiado')); }
  catch { const x = $('#codigo'); x.focus(); x.select(); toast(t('tCopiaManual')); }
};

// ---------- guardados (solo en este navegador) ----------
const KEY = 'forja-bsh-personajes';
const leer = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
const escribir = a => { try { localStorage.setItem(KEY, JSON.stringify(a)); return true; } catch { return false; } };
function renderRoster() {
  const a = leer();
  $('#roster').innerHTML = a.length ? `<span class="etq">${t('guardados')}</span>` + a.map((p, i) =>
    `<div><span><b>${p.nombre || t('sinNombre')}</b> · ${p.origen ? nomOrigen(p.origen) : '—'}</span><span class="acciones">
      <button class="btn mini" data-cargar="${i}">${t('abrir')}</button><button class="btn mini" data-borrar="${i}">${t('quitar')}</button></span></div>`).join('') : '';
}
$('#guardar').onclick = () => { const a = leer(); a.unshift(JSON.parse(JSON.stringify(P)));
  toast(escribir(a.slice(0, 30)) ? t('tGuardado') : t('tNoGuarda')); renderRoster(); };
$('#roster').onclick = e => {
  const c = e.target.dataset.cargar, b = e.target.dataset.borrar, a = leer();
  if (c !== undefined) { P = { ...vacio(), ...a[+c] }; render(); toast(t('tAbierto')); }
  if (b !== undefined) { a.splice(+b, 1); escribir(a); renderRoster(); }
};

// ---------- macro de Foundry ----------
const MACRO = document.getElementById('macro-foundry').textContent.trim();
$('#copiarMacro').onclick = async () => {
  try { await navigator.clipboard.writeText(MACRO); toast(t('tMacro')); }
  catch { $('#codigo').value = MACRO; $('#codigo').focus(); $('#codigo').select(); toast(t('tCopiaManual')); }
};
$('#bajarMacro').onclick = () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([MACRO], { type: 'text/javascript' }));
  a.download = 'importar-personaje-bsh.js'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---------- buzón de sugerencias (Web3Forms) ----------
$('#buzon').hidden = !CONFIG.buzonClave;
$('#buzon').onsubmit = async e => {
  e.preventDefault();
  const f = e.target, est = $('#bEstado'), btn = $('#bEnviar');
  if (f._honey.value) return;
  if (!f.mensaje.value.trim()) { est.className = 'estado mal'; est.textContent = t('bVacio'); f.mensaje.focus(); return; }
  btn.disabled = true; est.className = 'estado'; est.textContent = t('bEnviando');
  try {
    const correo = f.correo.value.trim();
    const datos = { access_key: CONFIG.buzonClave, subject: 'Forja de la Espada Negra: sugerencia',
      from_name: 'Forja de la Espada Negra', botcheck: '',
      mensaje: f.mensaje.value.trim(), nombre: f.nombre.value.trim() || '—', correo: correo || '—', idioma: LANG.toUpperCase() };
    if (correo) datos.replyto = correo;
    const r = await fetch('https://api.web3forms.com/submit', { method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(datos) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.success) throw new Error(j.message || r.status);
    est.className = 'estado ok'; est.textContent = t('bOk'); f.reset();
  } catch { est.className = 'estado mal'; est.textContent = t('bMal'); }
  btn.disabled = false;
};

// ---------- logo ----------
if (CONFIG.logo) {
  const img = new Image(); img.alt = CONFIG.sello || CONFIG.autor;
  img.onload = () => { const l = $('#logo'); l.innerHTML = ''; l.appendChild(img); };
  img.src = CONFIG.logo;
}

// Arranca con un personaje de ejemplo ya forjado, en el primer paso
textosFijos(); todoAzar(); S = 0; render();
</script>
